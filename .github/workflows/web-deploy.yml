# ====================================================================
# Web 发版工作流
# ====================================================================
# 触发条件：push tag web-v*（如 web-v1.0.2）
#
# 完整流程：
#   1. 将 dev 分支 merge 到 main（fast-forward 或 merge commit）
#   2. push main 到远程 → 触发 cicd.yml 的 CI 检查 + 部署
#   3. cicd.yml 的 sync-dev + changelog 自动执行
#
# 不走 PR 流程，因为 github-actions bot 创建的 PR 触发的 CI 需要审批，
# 审批过期后 workflow 标记为 failure。直接 merge + push 更简洁可靠。
#
# 版本命名建议：
#   - 新功能：minor+1（如 web-v1.1.0）
#   - 修复补丁：patch+1（如 web-v1.0.2）
#   - 大版本：major+1（如 web-v2.0.0）
# ====================================================================

name: Web Deploy

on:
  push:
    tags:
      - 'web-v*'

jobs:
  merge-and-deploy:
    name: 合并 dev 到 main 并触发部署
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 从 tag 名提取版本号（web-v1.0.2 → 1.0.2）
      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#web-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 检查 dev 和 main 之间是否有差异
      - name: Check diff
        id: diff
        run: |
          git fetch origin main dev
          AHEAD=$(git rev-list --count origin/main..origin/dev)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          if [ "$AHEAD" = "0" ]; then
            echo "⚠️ dev 和 main 之间没有差异，无需部署"
          else
            echo "dev 领先 main $AHEAD 个 commit"
          fi

      # 直接 merge dev 到 main 并 push
      # 不走 PR，避免 github-actions bot 的 PR 触发 CI 需要审批的问题
      # push 到 main 后 cicd.yml 会自动触发 CI 检查 + 部署
      - name: Merge dev to main
        if: steps.diff.outputs.ahead != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          git merge origin/dev --no-edit -m "release: Web v${{ steps.version.outputs.version }}"
          git push origin main
          echo "✅ 已合并 dev 到 main，cicd.yml 将自动触发部署"

      # 通知 - 发版成功
      - name: 通知 - Web 发版成功
        if: success() && steps.diff.outputs.ahead != '0'
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send" \
            -d "title=ICube Web 发版成功" \
            -d "des=版本: v${{ steps.version.outputs.version }}%0A状态: ✅ 已合并到 main 并触发部署%0A时间: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S')"

      # 通知 - 无需部署
      - name: 通知 - 无需部署
        if: success() && steps.diff.outputs.ahead == '0'
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send" \
            -d "title=ICube Web 发版跳过" \
            -d "des=版本: v${{ steps.version.outputs.version }}%0A状态: ⚠️ dev 和 main 无差异，未部署%0A时间: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S')"

      # 通知 - 发版失败
      - name: 通知 - Web 发版失败
        if: failure()
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send" \
            -d "title=ICube Web 发版失败" \
            -d "des=版本: v${{ steps.version.outputs.version }}%0A状态: ❌ 合并或推送失败%0A时间: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S')%0A[查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
