name: CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'cube_api/**'
      - 'cube_front/**'
      - 'docker-compose.yml'
      - '**/Dockerfile'
      - 'scripts/**'
      - '.github/workflows/cicd.yml'
  push:
    branches: [main, dev]
    paths:
      - 'cube_api/**'
      - 'cube_front/**'
      - 'docker-compose.yml'
      - '**/Dockerfile'
      - 'scripts/**'
      - '.github/workflows/cicd.yml'

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  # ==================== CI：后端检查 ====================
  backend-check:
    name: 后端 Lint + Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      !contains(github.event.pull_request.changed_files, 'cube_front/')
    steps:
      - uses: actions/checkout@v5

      - name: 检查是否有后端代码变更
        id: changed-backend
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'cube_api/**'

      - name: 安装系统依赖（mysqlclient 编译需要）
        if: steps.changed-backend.outputs.backend == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - uses: actions/setup-python@v5
        if: steps.changed-backend.outputs.backend == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: cube_api/requirements.txt

      - name: 安装 Python 依赖
        if: steps.changed-backend.outputs.backend == 'true'
        working-directory: cube_api
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff 代码检查
        if: steps.changed-backend.outputs.backend == 'true'
        run: ruff check cube_api/cube_api/
        continue-on-error: true

      - name: 运行后端全量测试
        if: steps.changed-backend.outputs.backend == 'true'
        working-directory: cube_api
        run: python manage.py test --verbosity=2

  # ==================== CI：前端构建验证 ====================
  frontend-check:
    name: 前端 Build 验证
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      !contains(github.event.pull_request.changed_files, 'cube_api/')
    steps:
      - uses: actions/checkout@v5

      - name: 检查是否有前端代码变更
        id: changed-frontend
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'cube_front/**'

      - uses: actions/setup-node@v5
        if: steps.changed-frontend.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cube_front/package-lock.json

      - name: 安装前端依赖
        if: steps.changed-frontend.outputs.frontend == 'true'
        working-directory: cube_front
        run: npm ci

      - name: 构建验证
        if: steps.changed-frontend.outputs.frontend == 'true'
        working-directory: cube_front
        run: npm run build

  # ==================== CI：Docker 构建验证 ====================
  docker-build:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      !contains(github.event.pull_request.changed_files, 'cube_api/')
    steps:
      - uses: actions/checkout@v5

      - name: 检查是否有 Docker 相关变更
        id: changed-docker
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'docker-compose.yml'
              - '**/Dockerfile'
              - 'cube_api/Dockerfile'
              - 'cube_front/Dockerfile'

      - name: 构建后端镜像
        if: steps.changed-docker.outputs.docker == 'true'
        run: docker build -t icube-api-ci ./cube_api

      - name: 构建前端镜像
        if: steps.changed-docker.outputs.docker == 'true'
        run: docker build -t icube-front-ci ./cube_front

      - name: 验证 compose 配置
        if: steps.changed-docker.outputs.docker == 'true'
        run: docker compose config -q

  # ==================== CD：自动部署（仅 main 分支） ====================
  deploy:
    name: 部署到生产服务器
    needs: [backend-check, frontend-check, docker-build]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !cancelled() &&
      (needs.backend-check.result == 'success' || needs.backend-check.result == 'skipped') &&
      (needs.frontend-check.result == 'success' || needs.frontend-check.result == 'skipped') &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== [1/3] 数据库备份 ==="
            ./scripts/backup.sh || echo "警告: 备份失败，继续部署"

            echo "=== [2/3] 拉取代码并部署（含健康检查 + 自动回滚） ==="
            ./scripts/deploy/deploy_update.sh --non-interactive
            DEPLOY_EXIT=$?

            echo "=== [3/3] 部署结果 ==="
            echo "当前 commit: $(git rev-parse --short HEAD)"
            echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"

            if [ $DEPLOY_EXIT -ne 0 ]; then
              echo "❌ 部署失败（可能已自动回滚）"
              docker compose ps
              exit $DEPLOY_EXIT
            else
              echo "✅ 部署成功"
            fi
