# ============================================================================
# ICube CI/CD 工作流
# ============================================================================
# 触发条件：
#   - PR 到 main：CI 检查（不部署）
#   - push 到 dev：CI 检查（不部署）
#   - push 到 main（合并后）：CI 检查 + 自动部署 + sync-dev + changelog
#   - 纯文档变更：触发部署（CI 检查自动 skip），确保服务器 docs 同步
#
# 完整流程文档：docs/guides/Git分支策略与CICD流程.md
# ============================================================================

name: CI/CD

# ============================== 触发条件 ==============================
# 顶层 paths 过滤：以下路径有变更时触发工作流
# 文档变更也触发，确保服务器 docs 同步；CI Job 内部有二级过滤，纯文档时自动 skip
on:
  pull_request:
    branches: [main]
    paths:
      - 'cube_api/**'              # 后端代码
      - 'cube_front/**'            # 前端代码
      - 'docker-compose.yml'       # Docker 编排配置
      - '**/Dockerfile'            # Dockerfile 变更
      - 'scripts/**'               # 部署脚本
      - '.github/workflows/cicd.yml' # CI/CD 配置自身
      - 'docs/**'                  # 文档（触发部署，CI 自动 skip）
      - 'README.md'                # 项目说明
  push:
    branches: [main, dev]          # main=部署，dev=仅检查
    paths:
      - 'cube_api/**'
      - 'cube_front/**'
      - 'docker-compose.yml'
      - '**/Dockerfile'
      - 'scripts/**'
      - '.github/workflows/cicd.yml'
      - 'docs/**'                  # 文档（触发部署，CI 自动 skip）
      - 'README.md'

# ============================== 全局环境变量 ==============================
env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # CI Job 1/4：后端 Lint + Test
  # ===========================================================================
  # 职责：Ruff 代码检查 + pytest 全量测试 + 覆盖率报告
  # 触发：push 到 dev/main 或 PR 中含后端代码变更
  # 耗时：~2min
  # ===========================================================================
  backend-check:
    name: 后端 Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2           # push 场景需要 HEAD~1；PR 场景会 fetch base

      # ---- 路径检测：只有 cube_api/** 变更时才执行后续步骤 ----
      - name: 检查是否有后端代码变更
        id: changed-backend
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR 场景：与目标分支比较
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -c '^cube_api/' || true)
          else
            # push 场景：与上一个 commit 比较
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -c '^cube_api/' || true)
          fi
          if [[ $CHANGED -gt 0 ]]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi
          echo "后端变更文件数: $CHANGED"

      # ---- 系统依赖：mysqlclient 编译需要 MySQL 开发库 ----
      - name: 安装系统依赖（mysqlclient 编译需要）
        if: steps.changed-backend.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      # ---- Python 环境 ----
      - uses: actions/setup-python@v5
        if: steps.changed-backend.outputs.any_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'                                   # 缓存 pip 下载
          cache-dependency-path: cube_api/requirements.txt

      # ---- Python 依赖安装 ----
      # requirements.txt 含 pytest/pytest-django/pytest-cov/fakeredis
      - name: 安装 Python 依赖
        if: steps.changed-backend.outputs.any_changed == 'true'
        working-directory: cube_api
        run: |
          pip install -r requirements.txt
          pip install ruff

      # ---- Ruff 代码检查（不阻塞，仅提示）----
      - name: Ruff 代码检查
        if: steps.changed-backend.outputs.any_changed == 'true'
        working-directory: cube_api
        run: ruff check cube_api/
        continue-on-error: true    # Lint 失败不阻塞测试和部署

      # ---- pytest 全量测试 ----
      # 测试环境自动切换：SQLite 内存库 + LocMemCache + fakeredis
      # --cov 指定覆盖率统计范围：apps + utils
      # --cov-report=xml 供上传 artifact
      # --cov-report=term-missing 终端显示未覆盖行
      - name: 运行后端全量测试
        if: steps.changed-backend.outputs.any_changed == 'true'
        working-directory: cube_api
        run: pytest --cov=cube_api/apps --cov=cube_api/utils --cov-report=xml --cov-report=term-missing

      # ---- 覆盖率报告上传（保留 30 天）----
      - name: 上传覆盖率报告
        if: steps.changed-backend.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: cube_api/coverage.xml
          retention-days: 30

  # ===========================================================================
  # CI Job 2/4：前端构建验证
  # ===========================================================================
  # 职责：npm ci + vite build，验证前端代码可正常构建
  # 触发：push 到 dev/main 或 PR 中含前端代码变更
  # 耗时：~2min
  # ===========================================================================
  frontend-check:
    name: 前端 Build 验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # ---- 路径检测：只有 cube_front/** 变更时才执行后续步骤 ----
      - name: 检查是否有前端代码变更
        id: changed-frontend
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -c '^cube_front/' || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -c '^cube_front/' || true)
          fi
          if [[ $CHANGED -gt 0 ]]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi
          echo "前端变更文件数: $CHANGED"

      # ---- Node.js 环境 ----
      - uses: actions/setup-node@v5
        if: steps.changed-frontend.outputs.any_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cube_front/package-lock.json

      # ---- 前端依赖安装（基于 lock 文件，确保一致性）----
      - name: 安装前端依赖
        if: steps.changed-frontend.outputs.any_changed == 'true'
        working-directory: cube_front
        run: npm ci

      # ---- Vite 生产构建验证 ----
      - name: 构建验证
        if: steps.changed-frontend.outputs.any_changed == 'true'
        working-directory: cube_front
        run: npm run build

  # ===========================================================================
  # CI Job 3/4：后端 Docker 镜像构建验证
  # ===========================================================================
  # 职责：验证后端 Dockerfile 可正常构建
  # 触发：后端 Dockerfile 或 docker-compose.yml 变更时
  # 使用 BuildKit 层缓存加速：依赖不变时约 30s
  # ===========================================================================
  docker-build-api:
    name: 后端 Docker 构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # ---- 路径检测：Docker 相关文件变更时才构建 ----
      - name: 检查是否有后端 Docker 相关变更
        id: changed-docker-api
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            DIFF_CMD="git diff --name-only origin/${{ github.base_ref }} HEAD"
          else
            DIFF_CMD="git diff --name-only HEAD~1 HEAD"
          fi
          CHANGED=$(eval $DIFF_CMD | grep -cE '^(docker-compose\.yml|cube_api/Dockerfile)' || true)
          if [[ $CHANGED -gt 0 ]]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi
          echo "后端 Docker 变更文件数: $CHANGED"

      # ---- 启用 Docker BuildKit ----
      - name: 设置 Docker Buildx
        if: steps.changed-docker-api.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3

      # ---- 构建后端镜像（带层缓存）----
      - name: 构建后端镜像
        if: steps.changed-docker-api.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./cube_api
          push: false
          load: true
          tags: icube-api-ci:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ===========================================================================
  # CI Job 4/4：前端 Docker 镜像构建验证 + compose 校验
  # ===========================================================================
  # 职责：验证前端 Dockerfile 可正常构建 + compose 配置语法正确
  # 触发：前端 Dockerfile 或 docker-compose.yml 变更时
  # 使用 BuildKit 层缓存加速：依赖不变时约 20s
  # ===========================================================================
  docker-build-front:
    name: 前端 Docker 构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # ---- 路径检测：Docker 相关文件变更时才构建 ----
      - name: 检查是否有前端 Docker 相关变更
        id: changed-docker-front
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            DIFF_CMD="git diff --name-only origin/${{ github.base_ref }} HEAD"
          else
            DIFF_CMD="git diff --name-only HEAD~1 HEAD"
          fi
          CHANGED=$(eval $DIFF_CMD | grep -cE '^(docker-compose\.yml|cube_front/Dockerfile)' || true)
          if [[ $CHANGED -gt 0 ]]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi
          echo "前端 Docker 变更文件数: $CHANGED"

      # ---- 启用 Docker BuildKit ----
      - name: 设置 Docker Buildx
        if: steps.changed-docker-front.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3

      # ---- 构建前端镜像（带层缓存）----
      - name: 构建前端镜像
        if: steps.changed-docker-front.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./cube_front
          push: false
          load: true
          tags: icube-front-ci:latest
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

      # ---- compose 配置语法校验 ----
      - name: 验证 compose 配置
        if: steps.changed-docker-front.outputs.any_changed == 'true'
        run: docker compose config -q

  # ===========================================================================
  # CD Job：自动部署（仅 push 到 main 时触发）
  # ===========================================================================
  # 职责：SSH 到服务器执行部署，含强制同步、迁移检查、健康检查、自动回滚
  # 依赖：backend-check + frontend-check + docker-build-api + docker-build-front 全部通过或跳过
  # 后续：deploy → sync-dev → changelog
  # ===========================================================================
  deploy:
    name: 部署到生产服务器
    needs: [backend-check, frontend-check, docker-build-api, docker-build-front]
    # 仅 push 到 main 时部署；CI Job 可以是 success 或 skipped（路径过滤跳过）
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !cancelled() &&
      (needs.backend-check.result == 'success' || needs.backend-check.result == 'skipped') &&
      (needs.frontend-check.result == 'success' || needs.frontend-check.result == 'skipped') &&
      (needs.docker-build-api.result == 'success' || needs.docker-build-api.result == 'skipped') &&
      (needs.docker-build-front.result == 'success' || needs.docker-build-front.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ======================================================================
      # SSH 部署（核心步骤）
      # ======================================================================
      # 统一调用 deploy_update.sh，该脚本已集成：
      #   --force-sync     强制同步远程代码（本地改动自动备份为 patch）
      #   --backup-db      迁移前备份数据库，失败自动回滚数据库 + 代码
      #   --post-backup    部署成功后异步执行全量备份
      #   --non-interactive  非交互模式，适合 CI/CD
      # 脚本内部还包含：智能变更检测、增量构建、健康检查 + 代码回滚
      - name: SSH 部署
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            bash ./scripts/deploy/deploy_update.sh --non-interactive --force-sync --backup-db --post-backup

      # ==================== 部署通知（Server酱 → 微信）====================
      # 部署成功通知
      - name: 微信通知 - 部署成功
        if: success()
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send" \
            -d "title=ICube 部署成功" \
            -d "des=Commit: ${{ github.event.head_commit.message }}%0A时间: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S')%0A状态: ✅ 部署成功%0A[查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      # 部署失败通知（可能已自动回滚）
      - name: 微信通知 - 部署失败
        if: failure()
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send" \
            -d "title=ICube 部署失败" \
            -d "des=Commit: ${{ github.event.head_commit.message }}%0A时间: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S')%0A状态: ❌ 部署失败（可能已自动回滚）%0A[查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      # ==================== 部署日志持久化 ====================
      # 将 SSH 部署的 stdout 保存为 artifact，便于排查部署失败
      # always() 确保即使部署失败也会保存日志
      # continue-on-error 确保日志保存失败不影响整体流程
      - name: 保存部署日志
        if: always()
        env:
          DEPLOY_STDOUT: ${{ steps.deploy.outputs.stdout }}
        run: |
          printf '%s\n' "$DEPLOY_STDOUT" > deploy.log
        continue-on-error: true

      - name: 上传部署日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: deploy-log-${{ github.run_id }}
          path: deploy.log
          retention-days: 90
        continue-on-error: true

  # ===========================================================================
  # 后置 Job 1/2：同步 dev 到 main
  # ===========================================================================
  # 职责：部署成功后将 dev 分支强制同步到 main 最新 commit
  # 原因：Squash merge 后 dev 与 main 分叉，强制同步确保下次 PR 只含新提交
  # 依赖：deploy 成功
  # ===========================================================================
  sync-dev:
    name: 同步 dev 到 main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write              # 需要写权限才能 force push 到 dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0           # 完整历史，确保 dev 分支存在
          token: ${{ secrets.GITHUB_TOKEN }}

      # 将 dev 重置到 main 最新 commit 并 force push
      - name: 同步 dev 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout dev
          git reset --hard origin/main
          git push origin dev --force

  # ===========================================================================
  # 后置 Job 2/2：自动生成 CHANGELOG
  # ===========================================================================
  # 职责：从 git log 按 conventional commit 类型分组生成 CHANGELOG.md
  # 提交目标：推送到 dev 分支（main 受保护无法直接 push），随下次 PR 进入 main
  # 依赖：sync-dev 成功
  # ===========================================================================
  changelog:
    name: 生成 CHANGELOG
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: sync-dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0           # 需要完整 git log
          token: ${{ secrets.GITHUB_TOKEN }}

      # 按 conventional commit 类型分组生成 CHANGELOG.md
      # 遍历 feat/fix/docs/refactor/perf/test/ci/build/style/chore
      # 有提交才输出对应分组
      - name: 生成 CHANGELOG.md
        run: |
          {
            echo "# Changelog"
            echo ""
            echo "> 自动生成，请勿手动编辑"
            echo ""

            for entry in "feat:新功能" "fix:修复" "docs:文档" "refactor:重构" "perf:性能" "test:测试" "ci:CI/CD" "build:构建" "style:样式" "chore:杂务"; do
              type="${entry%%:*}"
              label="${entry##*:}"
              COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges --grep="^${type}" --reverse 2>/dev/null)
              if [ -n "$COMMITS" ]; then
                echo "## $type - $label"
                echo ""
                echo "$COMMITS"
                echo ""
                echo ""
              fi
            done
          } > CHANGELOG.md

      # 提交 CHANGELOG 到 dev 分支
      # git diff --staged --quiet 检测是否有变更，无变更则跳过 commit
      - name: 提交 CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout dev
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: 自动更新 CHANGELOG"
          git push origin dev
