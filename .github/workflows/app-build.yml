name: APP Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.1）'
        required: true
        default: ''

env:
  APP_DIR: cube_app
  ANDROID_DIR: cube_app/android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build web assets
        working-directory: ${{ env.APP_DIR }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # 生成 .env.production（因 .env.production 在 .gitignore 中，CI 需动态生成）
          if [ -n "$API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL=$API_BASE_URL" > .env.production
            echo "VITE_MEDIA_BASE_URL=$API_BASE_URL" >> .env.production
            echo ".env.production generated with API_BASE_URL=$API_BASE_URL"
          else
            echo "Warning: API_BASE_URL not set, using default from .env.production if exists"
          fi
          npm run build

      - name: Sync Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ env.ANDROID_DIR }}/icube.jks
          echo "KEYSTORE_FILE=icube.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # versionCode: major*10000 + minor*100 + patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_code=$CODE" >> $GITHUB_OUTPUT

      - name: Update version in build.gradle
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version }}\"/" app/build.gradle

      - name: Build release APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalRelease --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" "icube-v${{ steps.version.outputs.version }}.apk"
          ls -lh icube-v*.apk

      - name: Upload to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key "icube-v${{ steps.version.outputs.version }}.apk" "$SERVER_USER@$SERVER_HOST:~/ICube/downloads/"
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "cd ~/ICube && python3 -c \"
          import json, os
          f = 'cube_api/cube_api/apps/home/app_version.json'
          os.makedirs(os.path.dirname(f), exist_ok=True)
          d = json.load(open(f)) if os.path.exists(f) else {}
          d['version'] = '${{ steps.version.outputs.version }}'
          d['download_url'] = '/apk/icube-v${{ steps.version.outputs.version }}.apk'
          d['update_info'] = f'ICube v${{ steps.version.outputs.version }}'
          d['force_update'] = d.get('force_update', False)
          json.dump(d, open(f, 'w'), ensure_ascii=False, indent=2)
          print('app_version.json updated')
          \""

      - name: Create GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: icube-v${{ steps.version.outputs.version }}.apk
          name: ICube v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
