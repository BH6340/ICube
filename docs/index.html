<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICube 文档</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
  <style>
    :root {
      --black: #1a1a2e;
      --text: #333;
      --text-light: #666;
      --text-faded: #999;
      --border: #e0e0e0;
      --bg: #fff;
      --bg-sidebar: #f7f7f7;
      --bg-code: #f6f8fa;
      --bg-hover: #ececec;
      --bg-active: #e0e0e0;
      --sidebar-w: 280px;
      --toc-w: 240px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 15px; line-height: 1.8; color: var(--text); background: var(--bg);
    }

    /* ===== 布局 ===== */
    .content { margin-left: var(--sidebar-w); margin-right: var(--toc-w); transition: margin-left 0.2s ease, margin-right 0.2s ease; }
    body.nav-collapsed .content { margin-left: 0 !important; }
    body.toc-collapsed .content { margin-right: 0 !important; }
    .markdown-section { max-width: 820px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

    /* ===== 左侧边栏 ===== */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
      background: var(--bg-sidebar); border-right: 1px solid var(--border);
      overflow-y: auto; overflow-x: hidden; transition: margin-left 0.2s ease; z-index: 100;
    }
    body.nav-collapsed .sidebar { margin-left: calc(-1 * var(--sidebar-w)); }

    .sidebar-resizer {
      position: fixed; top: 0; left: var(--sidebar-w); bottom: 0; width: 5px;
      cursor: col-resize; background: transparent; z-index: 101; transition: left 0.2s ease;
    }
    .sidebar-resizer:hover { background: var(--border); }
    body.nav-collapsed .sidebar-resizer { display: none; }

    /* 折叠按钮 — 注意：类名避免和 Docsify 内置冲突 */
    .nav-toggle-btn {
      position: fixed; top: 14px; left: calc(var(--sidebar-w) - 38px); z-index: 200;
      width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--text-light); transition: left 0.2s ease, background 0.15s;
    }
    body.nav-collapsed .nav-toggle-btn { left: 10px; }
    .nav-toggle-btn:hover { background: var(--bg-hover); color: var(--black); }

    /* Logo 区 */
    .sidebar .app-name { padding: 1rem 1.5rem 0.25rem; }
    .sidebar .app-name-link {
      font-size: 1.2rem; font-weight: 700; color: var(--black) !important; text-decoration: none !important;
    }
    .sidebar .app-name-link:visited { color: var(--black) !important; }

    /* 搜索框 */
    .search { padding: 0 1rem 0.5rem; }
    .search input {
      width: 100%; font-size: 0.85rem; padding: 0.5rem 0.75rem;
      border: 1px solid var(--border); border-radius: 6px; background: white; outline: none;
    }
    .search input:focus { border-color: var(--text-light); }

    /* 导航 */
    .sidebar-nav { padding: 0.5rem 0.5rem 2rem; }
    .sidebar-nav ul { list-style: none; }

    /* 分组标题（可折叠） */
    .sidebar-nav > ul > li { margin-top: 0.5rem; }
    .sidebar-nav > ul > li:first-child { margin-top: 0; }

    .nav-group-header {
      display: flex; align-items: center; cursor: pointer; user-select: none;
      font-size: 0.72rem; font-weight: 700; color: var(--text-faded);
      text-transform: uppercase; letter-spacing: 1px;
      padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--border);
    }
    .nav-group-header .caret {
      display: inline-block; width: 12px; height: 12px; margin-right: 6px;
      transition: transform 0.15s ease; font-size: 10px; color: var(--text-faded);
    }
    .nav-group-header.collapsed .caret { transform: rotate(-90deg); }
    .nav-group-header.collapsed { border-bottom: none; }
    .nav-group-children { overflow: hidden; transition: max-height 0.2s ease; }
    .nav-group-children.collapsed { max-height: 0 !important; }

    /* 二级链接（文件名） */
    .sidebar-nav > ul > li > ul > li > a,
    .sidebar-nav > ul > li:first-child > a[href] {
      display: block; font-size: 0.85rem; color: var(--text) !important;
      text-decoration: none !important; padding: 0.3rem 0.75rem 0.3rem 1.5rem;
      border-radius: 4px; transition: background 0.1s, color 0.1s;
    }
    .sidebar-nav > ul > li > ul > li > a:visited,
    .sidebar-nav > ul > li:first-child > a[href]:visited { color: var(--text) !important; }
    .sidebar-nav > ul > li > ul > li > a:hover { background: var(--bg-hover); color: var(--black) !important; }
    .sidebar-nav > ul > li > ul > li > a.active,
    .sidebar-nav > ul > li:first-child > a[href].active {
      color: var(--black) !important; font-weight: 600; background: var(--bg-active);
    }
    .sidebar-nav > ul > li > ul > li > a.active:visited { color: var(--black) !important; }

    /* ===== 右侧 TOC ===== */
    .toc-sidebar {
      position: fixed; top: 0; right: 0; bottom: 0; width: var(--toc-w);
      background: var(--bg-sidebar); border-left: 1px solid var(--border);
      overflow-y: auto; transition: margin-right 0.2s ease; z-index: 100;
    }
    body.toc-collapsed .toc-sidebar { margin-right: calc(-1 * var(--toc-w)); }

    .toc-toggle-btn {
      position: fixed; top: 14px; right: calc(var(--toc-w) - 38px); z-index: 200;
      width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--text-light); transition: right 0.2s ease, background 0.15s;
    }
    body.toc-collapsed .toc-toggle-btn { right: 10px; }
    .toc-toggle-btn:hover { background: var(--bg-hover); color: var(--black); }

    .toc-header {
      padding: 3rem 1rem 0.75rem; border-bottom: 1px solid var(--border); text-align: center;
    }
    .toc-header-label {
      font-size: 0.65rem; font-weight: 700; color: var(--text-faded);
      text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.3rem;
    }
    .toc-header-title {
      font-size: 0.85rem; font-weight: 600; color: var(--black);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toc-list { list-style: none; padding: 0.5rem 0.5rem; }
    .toc-list li { margin: 0; }
    .toc-list a {
      display: block; font-size: 0.8rem; color: var(--text-light) !important;
      text-decoration: none !important; padding: 0.22rem 0.5rem;
      border-left: 2px solid transparent; transition: all 0.1s; line-height: 1.5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toc-list a:visited { color: var(--text-light) !important; }
    .toc-list a:hover { color: var(--black) !important; }
    .toc-list a.toc-active {
      color: var(--black) !important; border-left-color: var(--black); font-weight: 500;
    }
    .toc-list .toc-h2 { padding-left: 1rem; }
    .toc-list .toc-h3 { padding-left: 1.75rem; font-size: 0.75rem; }

    /* ===== 内容区 — Typora 风格 ===== */
    .markdown-section h1 {
      font-size: 1.75rem; font-weight: 700; color: var(--black);
      margin: 0 0 1.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
    }
    .markdown-section h2 {
      font-size: 1.35rem; font-weight: 700; color: var(--black);
      margin: 2rem 0 0.85rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border);
    }
    .markdown-section h3 { font-size: 1.15rem; font-weight: 600; color: var(--black); margin: 1.5rem 0 0.6rem; }
    .markdown-section h4 { font-size: 1rem; font-weight: 600; color: var(--text); margin: 1.25rem 0 0.5rem; }
    .markdown-section p { margin: 0.6rem 0; color: var(--text); }
    .markdown-section a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border); }
    .markdown-section a:hover { color: var(--black); text-decoration-color: var(--black); }
    .markdown-section a:visited { color: var(--text); }
    .markdown-section ul, .markdown-section ol { margin: 0.6rem 0; padding-left: 1.5rem; }
    .markdown-section li { margin: 0.25rem 0; }
    .markdown-section table {
      width: 100%; border-collapse: collapse; margin: 1rem 0;
      font-size: 0.9rem; border: 1px solid var(--border);
    }
    .markdown-section table thead { background: #f2f2f2; }
    .markdown-section table thead th {
      font-weight: 600; padding: 0.6rem 0.85rem; text-align: left; border: 1px solid var(--border); color: var(--text);
    }
    .markdown-section table tbody td { padding: 0.5rem 0.85rem; border: 1px solid var(--border); color: var(--text); }
    .markdown-section table tbody tr:nth-child(even) { background: #fafafa; }
    .markdown-section code {
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', monospace;
      font-size: 0.85em; padding: 0.12rem 0.35rem; background: var(--bg-code); border-radius: 3px; color: #c7254e;
    }
    .markdown-section pre {
      background: var(--bg-code); border: 1px solid var(--border); border-radius: 6px;
      padding: 1rem 1.25rem; margin: 1rem 0; overflow-x: auto; line-height: 1.6;
    }
    .markdown-section pre code { background: none; color: var(--text); padding: 0; font-size: 0.85rem; }
    .markdown-section blockquote {
      border-left: 4px solid var(--border); background: #f9f9f9; padding: 0.6rem 1.1rem;
      margin: 1rem 0; color: var(--text-light); border-radius: 0 4px 4px 0;
    }
    .markdown-section blockquote p { margin: 0.2rem 0; }
    .markdown-section hr { border: none; height: 1px; background: var(--border); margin: 2rem 0; }
    .markdown-section img { max-width: 100%; border-radius: 4px; }
    .docsify-copy-code-button {
      background: rgba(0,0,0,0.05) !important; color: var(--text-light) !important;
      border-radius: 4px !important; font-size: 0.72rem !important; padding: 2px 8px !important;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    /* ===== 右侧代码面板 ===== */
    .code-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 45%;
      max-width: 80%; min-width: 350px;
      background: #1e1e1e; border-left: 1px solid #2d2d2d;
      display: flex; flex-direction: column; z-index: 300;
      transform: translateX(100%); transition: transform 0.2s ease;
    }
    .code-panel.expanded { transform: translateX(0); }

    .code-panel-resizer {
      position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
      cursor: col-resize; background: transparent; z-index: 301;
    }
    .code-panel-resizer:hover { background: #2d2d2d; }

    .code-tab-bar {
      display: flex; align-items: center; height: 38px;
      background: #181818; border-bottom: 1px solid #2d2d2d;
      overflow-x: auto; overflow-y: hidden; flex-shrink: 0;
    }
    .code-tab-bar::-webkit-scrollbar { height: 2px; }

    .code-tab {
      display: flex; align-items: center; gap: 6px;
      padding: 0 0.75rem; height: 100%; flex-shrink: 0;
      font-size: 0.78rem; color: #808080; cursor: pointer;
      border-right: 1px solid #2d2d2d; white-space: nowrap;
      transition: background 0.1s, color 0.1s;
    }
    .code-tab:hover { background: #2d2d2d; color: #d4d4d4; }
    .code-tab.active { background: #1e1e1e; color: #d4d4d4; font-weight: 600; }
    .code-tab .tab-close {
      display: flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 3px;
      font-size: 12px; color: #808080; cursor: pointer;
    }
    .code-tab .tab-close:hover { background: #2d2d2d; color: #d4d4d4; }

    .code-panel-toolbar {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 0 0.5rem; height: 100%; flex-shrink: 0;
      border-left: 1px solid #2d2d2d;
    }
    .code-panel-toolbar button {
      width: 28px; height: 28px; border: none; background: transparent;
      cursor: pointer; font-size: 16px; color: #808080;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
    }
    .code-panel-toolbar button:hover { background: #2d2d2d; color: #d4d4d4; }

    .code-content-wrap {
      flex: 1; overflow-y: auto; overflow-x: auto; position: relative;
    }
    .code-content {
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', monospace;
      font-size: 0.82rem; line-height: 1.6; white-space: pre;
      padding: 0.5rem 0; position: relative; color: #d4d4d4;
    }
    .code-line {
      display: flex; padding: 0; min-width: max-content;
    }
    .code-line .line-num {
      flex-shrink: 0; width: 3rem; text-align: right;
      padding-right: 0.75rem; color: #858585;
      user-select: none; border-right: 1px solid #2d2d2d;
    }
    .code-line .line-content {
      padding-left: 0.75rem; white-space: pre;
    }
    .code-line.highlight {
      background: #264f78;
    }
    .code-line.highlight .line-num {
      color: #569cd6; font-weight: 600;
    }
    .code-line.highlight .line-content::before {
      content: '▶ '; color: #569cd6; font-size: 0.7rem;
    }
    .code-error {
      padding: 2rem; text-align: center; color: #f48771; font-size: 0.9rem;
    }
    .code-loading {
      padding: 2rem; text-align: center; color: #808080; font-size: 0.9rem;
    }

    /* Prism token 颜色（VS Code Dark+ 风格） */
    .code-content .token.comment,
    .code-content .token.prolog,
    .code-content .token.doctype,
    .code-content .token.cdata { color: #6a9955; }
    .code-content .token.punctuation { color: #d4d4d4; }
    .code-content .token.property,
    .code-content .token.tag,
    .code-content .token.constant,
    .code-content .token.symbol,
    .code-content .token.deleted { color: #f92672; }
    .code-content .token.boolean,
    .code-content .token.number { color: #b5cea8; }
    .code-content .token.selector,
    .code-content .token.attr-name,
    .code-content .token.string,
    .code-content .token.char,
    .code-content .token.builtin,
    .code-content .token.inserted { color: #ce9178; }
    .code-content .token.operator,
    .code-content .token.entity,
    .code-content .token.url,
    .code-content .token.variable { color: #d4d4d4; }
    .code-content .token.atrule,
    .code-content .token.attr-value,
    .code-content .token.function,
    .code-content .token.class-name { color: #dcdcaa; }
    .code-content .token.keyword { color: #569cd6; }
    .code-content .token.regex,
    .code-content .token.important { color: #d16969; }

    /* 折叠后的展开按钮 */
    .code-expand-btn {
      position: fixed; top: 14px; right: 10px; z-index: 300;
      width: 28px; height: 28px; border: 1px solid #2d2d2d; border-radius: 5px;
      background: #1e1e1e; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #808080; transition: background 0.15s;
    }
    .code-expand-btn:hover { background: #2d2d2d; color: #d4d4d4; }

    /* 代码面板折叠时，TOC 按钮下移避免重叠 */
    body.code-panel-collapsed .toc-toggle-btn { top: 52px; }

    /* 代码链接样式 */
    .markdown-section a.code-link {
      color: #1565c0 !important; text-decoration: underline;
      text-decoration-color: #90caf9; text-underline-offset: 2px;
      cursor: pointer;
    }
    .markdown-section a.code-link:hover {
      color: #0d47a1; text-decoration-color: #0d47a1;
    }

    /* TOC 拖拽条 */
    .toc-resizer {
      position: fixed; top: 0; right: var(--toc-w); bottom: 0; width: 5px;
      cursor: col-resize; background: transparent; z-index: 101; transition: right 0.2s ease;
    }
    .toc-resizer:hover { background: var(--border); }
    body.toc-collapsed .toc-resizer { display: none; }

    @media (max-width: 900px) {
      /* 平板：TOC 默认折叠，可点击展开（浮层模式，不挤压内容） */
      :root { --toc-w: 220px; }
      body.toc-collapsed .toc-sidebar { margin-right: calc(-1 * var(--toc-w)); }
      body.toc-collapsed .content { margin-right: 0; }
      body:not(.toc-collapsed) .toc-sidebar {
        box-shadow: -2px 0 12px rgba(0,0,0,0.1);
      }
      .code-panel { width: 100%; max-width: none; min-width: 0; }
      /* 代码面板折叠时，TOC按钮位置在平板上也调整 */
      body.code-panel-collapsed.toc-collapsed .toc-toggle-btn { top: 52px; }
    }
    @media (max-width: 600px) {
      :root { --sidebar-w: 260px; --toc-w: 200px; }
      .markdown-section { padding: 1.5rem 1rem 3rem; }
    }
  </style>
</head>
<body>
  <button class="nav-toggle-btn" id="navToggleBtn">☰</button>
  <div class="sidebar-resizer" id="sidebarResizer"></div>
  <button class="toc-toggle-btn" id="tocToggleBtn">☰</button>
  <div class="toc-resizer" id="tocResizer"></div>
  <div id="app"></div>

  <!-- 右侧代码面板 -->
  <div class="code-panel" id="codePanel">
    <div class="code-panel-resizer" id="codePanelResizer"></div>
    <div class="code-tab-bar" id="codeTabBar"></div>
    <div class="code-content-wrap" id="codeContentWrap"></div>
  </div>
  <!-- 折叠后的展开按钮 -->
  <button class="code-expand-btn" id="codeExpandBtn" title="展开代码面板" style="display:none;">»</button>

  <script>
    // ===== 折叠按钮（避免和 Docsify 内置类名冲突） =====
    document.getElementById('navToggleBtn').addEventListener('click', function() {
      document.body.classList.toggle('nav-collapsed');
    });
    document.getElementById('tocToggleBtn').addEventListener('click', function() {
      document.body.classList.toggle('toc-collapsed');
    });

    // ===== 拖拽调整左侧边栏宽度 =====
    (function() {
      var resizer = document.getElementById('sidebarResizer');
      var isResizing = false;
      resizer.addEventListener('mousedown', function(e) {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!isResizing) return;
        var newWidth = e.clientX;
        if (newWidth < 200) newWidth = 200;
        if (newWidth > 500) newWidth = 500;
        document.documentElement.style.setProperty('--sidebar-w', newWidth + 'px');
      });
      document.addEventListener('mouseup', function() {
        if (isResizing) { isResizing = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; }
      });
    })();

    // ===== 拖拽调整右侧 TOC 宽度 =====
    (function() {
      var resizer = document.getElementById('tocResizer');
      var isResizing = false;
      resizer.addEventListener('mousedown', function(e) {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!isResizing) return;
        var newWidth = window.innerWidth - e.clientX;
        if (newWidth < 180) newWidth = 180;
        if (newWidth > 400) newWidth = 400;
        document.documentElement.style.setProperty('--toc-w', newWidth + 'px');
      });
      document.addEventListener('mouseup', function() {
        if (isResizing) { isResizing = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; }
      });
    })();

    window.$docsify = {
      name: 'ICube 🧊',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 0,
      search: { placeholder: '搜索文档', noData: '没有找到结果', depth: 3 },
      copyCode: { buttonText: '复制', errorText: '复制失败', successText: '已复制' },
      auto2top: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      plugins: [
        function (hook) {
          // 在 marked 渲染之前，把 /code/ 链接转成 HTML <a> 标签
          // 这样 marked 直接透传，Docsify 路由不会篡改 data-code-href
          hook.beforeEach(function (content) {
            return content.replace(/\[([^\]]*)\]\((\/code\/[^)]+)\)/g, function (match, text, url) {
              return '<a class="code-link" data-code-href="' + url + '">' + text + '</a>';
            });
          });
          hook.doneEach(function () {
            buildTOC();
          });
        }
      ]
    };

    // ===== 侧边栏分组折叠 =====
    // 用 MutationObserver 监听 sidebar-nav 渲染完成
    (function () {
      var sidebarObserver = new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          m.addedNodes.forEach(function (node) {
            if (node.nodeType === 1 && node.classList && node.classList.contains('sidebar-nav')) {
              makeCollapsibleGroups();
              sidebarObserver.disconnect();
            }
          });
        });
      });

      // 先尝试立即执行（可能已渲染）
      function tryInit() {
        var nav = document.querySelector('.sidebar-nav');
        if (nav && nav.children.length > 0) {
          makeCollapsibleGroups();
          return true;
        }
        return false;
      }

      // 轮询等待 sidebar-nav 出现
      var attempts = 0;
      var pollTimer = setInterval(function () {
        if (tryInit() || attempts > 50) {
          clearInterval(pollTimer);
        }
        attempts++;
      }, 100);

      // 同时用 MutationObserver 兜底
      var app = document.getElementById('app');
      if (app) {
        sidebarObserver.observe(app, { childList: true, subtree: true });
      }
    })();

    function makeCollapsibleGroups() {
      var nav = document.querySelector('.sidebar-nav');
      if (!nav) return;
      var topLevelItems = nav.querySelectorAll(':scope > ul > li');
      topLevelItems.forEach(function (li) {
        var childUl = li.querySelector(':scope > ul');
        if (!childUl) return;

        if (li.querySelector('.nav-group-header')) return;

        var titleText = '';
        li.childNodes.forEach(function (node) {
          if (node.nodeType === 3 && node.textContent.trim()) {
            titleText = node.textContent.trim();
          }
        });
        if (!titleText) {
          var firstLink = li.querySelector(':scope > a');
          if (firstLink) titleText = firstLink.textContent.trim();
        }
        if (!titleText) return;

        li.childNodes.forEach(function (node) {
          if (node.nodeType === 3) node.textContent = '';
        });

        var header = document.createElement('div');
        header.className = 'nav-group-header';
        header.innerHTML = '<span class="caret">▶</span><span>' + titleText + '</span>';

        var wrapper = document.createElement('div');
        wrapper.className = 'nav-group-children';
        wrapper.style.maxHeight = childUl.offsetHeight + 'px';
        wrapper.style.overflow = 'hidden';
        wrapper.style.transition = 'max-height 0.2s ease';

        wrapper.appendChild(childUl);

        li.insertBefore(header, li.firstChild);
        li.insertBefore(wrapper, header.nextSibling);

        header.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          header.classList.toggle('collapsed');
          if (header.classList.contains('collapsed')) {
            wrapper.style.maxHeight = '0';
          } else {
            wrapper.style.maxHeight = wrapper.scrollHeight + 'px';
          }
        });
      });
    }

    // ===== 右侧 TOC =====
    function buildTOC() {
      var tocEl = document.querySelector('.toc-sidebar');
      if (!tocEl) {
        tocEl = document.createElement('aside');
        tocEl.className = 'toc-sidebar';
        document.body.appendChild(tocEl);
      }
      tocEl.innerHTML = '';

      // 获取当前文档标题（优先用侧边栏文件名，不用正文 H1）
      var docTitle = '';
      var activeLink = document.querySelector('.sidebar-nav a.active');
      if (activeLink) {
        docTitle = activeLink.textContent.trim();
      } else {
        // 兜底：从 URL hash 解析文件名
        var hash = location.hash.replace(/^#\//, '').split('?')[0];
        if (hash) {
          var name = hash.split('/').pop().replace(/\.md$/i, '');
          docTitle = decodeURIComponent(name);
        } else {
          docTitle = 'ICube 文档';
        }
      }

      // 标题区
      var header = document.createElement('div');
      header.className = 'toc-header';
      header.innerHTML =
        '<div class="toc-header-label">当前文档</div>' +
        '<div class="toc-header-title" title="' + docTitle + '">' + docTitle + '</div>';
      tocEl.appendChild(header);

      var headings = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3');
      if (headings.length < 2) { tocEl.style.display = 'none'; return; }
      tocEl.style.display = '';

      var list = document.createElement('ul');
      list.className = 'toc-list';

      headings.forEach(function (h) {
        if (!h.id) return;
        // 跳过 H1（已在标题区显示）
        if (h.tagName === 'H1') return;

        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.title = h.textContent;
        a.setAttribute('data-target', h.id);
        var level = h.tagName.toLowerCase();
        a.className = 'toc-' + level;
        li.appendChild(a);
        list.appendChild(li);
      });

      tocEl.appendChild(list);

      // 点击跳转
      var links = tocEl.querySelectorAll('.toc-list a');
      links.forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var target = document.getElementById(this.getAttribute('data-target'));
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      // 滚动高亮
      var scrollTimer = null;
      window.addEventListener('scroll', function () {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(highlightTOC, 80);
      });

      var allHeadings = document.querySelectorAll('.markdown-section h2, .markdown-section h3');
      function highlightTOC() {
        var scrollY = window.scrollY;
        var current = null;
        allHeadings.forEach(function (h) {
          if (h.offsetTop - 80 <= scrollY) current = h;
        });
        links.forEach(function (link) { link.classList.remove('toc-active'); });
        if (current) {
          var activeLink = tocEl.querySelector('.toc-list a[data-target="' + current.id + '"]');
          if (activeLink) activeLink.classList.add('toc-active');
        }
      }
      highlightTOC();
    }

    // ===== 右侧代码面板 =====
    var codePanel = {
      tabs: [],
      activeTabId: null,
      panel: null,
      tabbar: null,
      contentWrap: null,
      isExpanded: false,
      maxTabs: 8,

      init: function () {
        this.panel = document.getElementById('codePanel');
        this.tabbar = document.getElementById('codeTabBar');
        this.contentWrap = document.getElementById('codeContentWrap');

        // 拖拽调整宽度
        var resizer = document.getElementById('codePanelResizer');
        var isResizing = false;
        resizer.addEventListener('mousedown', function (e) {
          isResizing = true;
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        });
        document.addEventListener('mousemove', function (e) {
          if (!isResizing) return;
          var w = window.innerWidth - e.clientX;
          if (w < 350) w = 350;
          if (w > window.innerWidth * 0.75) w = window.innerWidth * 0.75;
          codePanel.panel.style.width = w + 'px';
        });
        document.addEventListener('mouseup', function () {
          if (isResizing) { isResizing = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; }
        });
      },

      parseLink: function (href) {
        // /code/apps/accounts/views.py#L45-L80
        var match = href.match(/^\/code\/(.+?)(?:#L(\d+)(?:-L?(\d+))?)?$/);
        if (!match) return null;
        return {
          path: match[1],
          start: match[2] ? parseInt(match[2]) : null,
          end: match[3] ? parseInt(match[3]) : null
        };
      },

      openTab: function (href) {
        var info = this.parseLink(href);
        if (!info) return;

        var self = this;

        // 展开面板
        if (!this.isExpanded) this.expand();

        // 已有该文件 Tab？
        var existing = this.tabs.find(function (t) { return t.id === info.path; });
        if (existing) {
          existing.highlight = { start: info.start, end: info.end };
          self.switchTab(existing.id);
          return;
        }

        // 超过最大 Tab 数，关闭最早的
        while (this.tabs.length >= this.maxTabs) {
          this.closeTab(this.tabs[0].id);
        }

        // 创建新 Tab
        var tab = {
          id: info.path,
          label: info.path.split('/').pop(),
          path: info.path,
          content: null,
          scrollTop: 0,
          highlight: { start: info.start, end: info.end },
          loading: true,
          error: false
        };
        this.tabs.push(tab);
        this.renderTabBar();
        this.switchTab(tab.id);

        // fetch 文件内容
        fetch('/code/' + info.path)
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function (text) {
            tab.content = text;
            tab.loading = false;
            if (self.activeTabId === tab.id) self.renderContent(tab);
          })
          .catch(function (err) {
            tab.error = true;
            tab.loading = false;
            if (self.activeTabId === tab.id) self.renderContent(tab);
          });
      },

      switchTab: function (tabId) {
        var self = this;
        // 保存当前 Tab 滚动位置
        var oldTab = this.tabs.find(function (t) { return t.id === self.activeTabId; });
        if (oldTab && this.contentWrap) oldTab.scrollTop = this.contentWrap.scrollTop;

        this.activeTabId = tabId;
        this.renderTabBar();

        var tab = this.tabs.find(function (t) { return t.id === tabId; });
        if (tab) this.renderContent(tab);
      },

      closeTab: function (tabId) {
        var idx = this.tabs.findIndex(function (t) { return t.id === tabId; });
        if (idx === -1) return;
        this.tabs.splice(idx, 1);

        // 关闭的是当前 Tab
        if (this.activeTabId === tabId) {
          if (this.tabs.length === 0) {
            this.activeTabId = null;
            this.collapse();
          } else {
            var next = this.tabs[Math.min(idx, this.tabs.length - 1)];
            this.switchTab(next.id);
          }
        }
        this.renderTabBar();
      },

      renderTabBar: function () {
        var self = this;
        this.tabbar.innerHTML = '';

        this.tabs.forEach(function (tab) {
          var el = document.createElement('div');
          el.className = 'code-tab' + (tab.id === self.activeTabId ? ' active' : '');
          el.innerHTML = '<span>' + tab.label + '</span><span class="tab-close" data-id="' + tab.id + '">×</span>';

          // 点击 Tab 切换
          el.addEventListener('click', function (e) {
            if (e.target.classList.contains('tab-close')) {
              e.stopPropagation();
              self.closeTab(tab.id);
            } else {
              self.switchTab(tab.id);
            }
          });

          self.tabbar.appendChild(el);
        });

        // 折叠按钮
        var toolbar = document.createElement('div');
        toolbar.className = 'code-panel-toolbar';
        toolbar.innerHTML = '<button id="codePanelCollapse" title="折叠">«</button>';
        toolbar.querySelector('button').addEventListener('click', function () {
          self.collapse();
        });
        this.tabbar.appendChild(toolbar);
      },

      renderContent: function (tab) {
        var self = this;
        this.contentWrap.innerHTML = '';

        if (tab.loading) {
          this.contentWrap.innerHTML = '<div class="code-loading">加载中…</div>';
          return;
        }

        if (tab.error) {
          this.contentWrap.innerHTML = '<div class="code-error">文件未找到：' + tab.path + '</div>';
          return;
        }

        var pre = document.createElement('div');
        pre.className = 'code-content';

        // Prism 高亮后按行拆分，正确处理跨行语法（docstring 等）
        var lang = self.detectLanguage(tab.path);
        var highlightedLines = self.highlightLines(tab.content, lang);

        var hlStart = tab.highlight.start;
        var hlEnd = tab.highlight.end || hlStart;

        highlightedLines.forEach(function (lineHtml, i) {
          var lineNum = i + 1;
          var isHl = hlStart && lineNum >= hlStart && lineNum <= hlEnd;

          var row = document.createElement('div');
          row.className = 'code-line' + (isHl ? ' highlight' : '');
          row.innerHTML =
            '<span class="line-num">' + lineNum + '</span>' +
            '<span class="line-content">' + lineHtml + '</span>';
          pre.appendChild(row);
        });

        this.contentWrap.appendChild(pre);

        // 恢复滚动位置
        this.contentWrap.scrollTop = tab.scrollTop || 0;

        // 滚动到高亮行（双重 rAF 确保浏览器完成布局后再读 offsetTop）
        if (hlStart) {
          var lineHeight = 0;
          var firstLine = pre.querySelector('.code-line');
          if (firstLine) lineHeight = firstLine.offsetHeight;

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              var hlEl = pre.querySelector('.code-line.highlight');
              if (hlEl && self.contentWrap) {
                // 高亮行顶部留 5 行空间
                var targetTop = hlEl.offsetTop - lineHeight * 5;
                self.contentWrap.scrollTop = Math.max(0, targetTop);
              }
            });
          });
        }

        // 保存滚动位置
        this.contentWrap.onscroll = function () {
          tab.scrollTop = self.contentWrap.scrollTop;
        };
      },

      expand: function () {
        this.isExpanded = true;
        this.panel.classList.add('expanded');
        document.body.classList.remove('code-panel-collapsed');
        var btn = document.getElementById('codeExpandBtn');
        if (btn) btn.style.display = 'none';
      },

      collapse: function () {
        this.isExpanded = false;
        this.panel.classList.remove('expanded');
        document.body.classList.add('code-panel-collapsed');
        var btn = document.getElementById('codeExpandBtn');
        if (btn) btn.style.display = 'flex';
      },

      escapeHtml: function (str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      },

      detectLanguage: function (path) {
        var lower = path.toLowerCase();
        if (lower.indexOf('dockerfile') !== -1) return 'bash';
        var ext = lower.split('.').pop();
        var map = {
          py: 'python', js: 'javascript', ts: 'typescript',
          vue: 'markup', html: 'markup', xml: 'markup',
          css: 'css', scss: 'css',
          yml: 'yaml', yaml: 'yaml',
          json: 'json', conf: 'nginx',
          md: 'markdown', sh: 'bash', sql: 'sql'
        };
        return map[ext] || null;
      },

      highlightLines: function (text, lang) {
        var rawLines = text.split('\n');

        // Prism 未加载或语言不支持：退回纯文本转义
        if (!lang || typeof Prism === 'undefined' || !Prism.languages[lang]) {
          return rawLines.map(this.escapeHtml);
        }

        // 整体高亮后按行拆分，正确处理跨行语法（docstring、多行注释等）
        var highlighted = Prism.highlight(text, Prism.languages[lang], lang);
        var temp = document.createElement('div');
        temp.innerHTML = highlighted;

        var result = [''];
        var tagStack = [];

        function escapeText(s) {
          return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function walk(node) {
          if (node.nodeType === 3) {
            var parts = node.textContent.split('\n');
            for (var i = 0; i < parts.length; i++) {
              if (i > 0) {
                // 行末：关闭所有打开的标签
                for (var j = tagStack.length - 1; j >= 0; j--) {
                  result[result.length - 1] += '</' + tagStack[j].tag + '>';
                }
                result.push('');
                // 新行：重新打开标签
                for (var j = 0; j < tagStack.length; j++) {
                  result[result.length - 1] += '<' + tagStack[j].tag + tagStack[j].attrs + '>';
                }
              }
              result[result.length - 1] += escapeText(parts[i]);
            }
          } else if (node.nodeType === 1) {
            var tag = node.tagName.toLowerCase();
            var attrs = '';
            for (var i = 0; i < node.attributes.length; i++) {
              var attr = node.attributes[i];
              attrs += ' ' + attr.name + '="' + attr.value + '"';
            }
            tagStack.push({ tag: tag, attrs: attrs });
            result[result.length - 1] += '<' + tag + attrs + '>';
            for (var i = 0; i < node.childNodes.length; i++) {
              walk(node.childNodes[i]);
            }
            result[result.length - 1] += '</' + tag + '>';
            tagStack.pop();
          }
        }

        for (var i = 0; i < temp.childNodes.length; i++) {
          walk(temp.childNodes[i]);
        }

        // 确保行数与原始一致
        while (result.length < rawLines.length) result.push('');
        if (result.length > rawLines.length) result = result.slice(0, rawLines.length);

        return result;
      }
    };

    // 初始化代码面板
    codePanel.init();

    // 展开按钮
    document.getElementById('codeExpandBtn').addEventListener('click', function () {
      if (codePanel.tabs.length > 0) {
        codePanel.expand();
      }
    });

    // 全局事件捕获：在 Docsify 路由之前拦截 /code/ 链接
    document.addEventListener('click', function (e) {
      var link = e.target.closest('a');
      if (!link) return;

      // 优先用 data-code-href（保留原始 #L 行号），否则用 href
      var codePath = link.getAttribute('data-code-href') || '';
      if (!codePath) {
        var href = link.getAttribute('href') || '';
        if (href.indexOf('/code/') === 0) codePath = href;
        else if (href.indexOf('#/code/') === 0) codePath = href.replace(/^#/, '');
        else return;
      }

      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();

      codePanel.openTab(codePath);
    }, true); // true = 捕获阶段，在 Docsify 之前执行
  </script>
