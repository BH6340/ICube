# 前端容器只负责提供 Vite 构建产物；公网入口仍由外层网关 Nginx 管理
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 生成的资源文件名包含内容哈希，可长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口文件引用最新的哈希资源，不应被浏览器长期缓存
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router history 模式：真实文件不存在时返回 SPA 入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 将容器日志交给 Docker 统一收集
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
