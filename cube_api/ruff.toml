# Ruff 配置文件
# 文档：https://docs.astral.sh/ruff/configuration/

# 行宽（Django 项目推荐 119，与 PEP 8 的 79 不同）
line-length = 119

# 目标 Python 版本
target-version = "py313"

# 排除的目录/文件
exclude = [
    "migrations",
    "__pycache__",
    "media",
    "static",
    "collected_static",
    "*.pyc",
]

[lint]
# 启用的规则类别（与 Ruff 默认一致：E/F/W/UP/I/B/RUF）
# 额外启用少量高价值规则：SIM（简化写法）、DTZ（时区）
# S（安全）、PL（Pylint）、PIE（性能）等规则误报多、改动大，暂不启用
select = [
    "E",    # pycodestyle 风格错误
    "W",    # pycodestyle 风格警告
    "F",    # pyflakes 逻辑错误
    "UP",   # pyupgrade 现代语法
    "I",    # isort 导入排序
    "B",    # flake8-bugbear 潜在 bug
    "SIM",  # 简化写法（高价值，如合并 if/else、合并 with 语句）
    "DTZ",  # 时区问题（高价值，datetime.now() 无时区是真问题）
    "RUF",  # Ruff 特有
]

# 忽略的规则
ignore = [
    # --- 中文项目特有，直接忽略 ---
    "RUF001",  # ambiguous-unicode-character-string — 中文字符串/标点是正常的
    "RUF002",  # ambiguous-unicode-character-docstring — 中文 docstring 是正常的
    "RUF003",  # ambiguous-unicode-character-comment — 中文注释是正常的

    # --- Django 项目特有，直接忽略 ---
    "RUF012",  # mutable-class-default — Django 模型/序列化器字段大量使用可变默认值，是正常写法
    "B017",    # assertRaises(Exception) — 测试中使用 Exception 是合理的

    # --- 风格类，项目历史包袱大，暂不强制 ---
    "D",       # docstring 缺失 — 老项目全面补齐成本高
    "N",       # 命名规范 — 与 Django 命名习惯有冲突（如模型字段名）
    "C90",     # McCabe 复杂度 — 老代码重构成本高
    "ANN",     # 类型注解缺失 — 老项目全面补齐成本高
]

# 按文件忽略特定规则
[lint.per-file-ignores]
# 测试文件放宽限制
"tests/**" = [
    "S101",     # assert 语句 — 测试里用 assert 是正常的
    "B017",     # assertRaises(Exception)
    "S110",     # try-except-pass
]
# Django settings 文件：from .dev import * 是标准写法
"**/settings/*.py" = [
    "F403",     # undefined-local-with-import-star
    "F405",     # undefined-local-with-import-star-usage
    "E402",     # module-import-not-at-top-of-file
]
# 迁移文件完全不检查（自动生成的）
"**/migrations/*.py" = ["ALL"]
