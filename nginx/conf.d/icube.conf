server {
    listen 80;
    server_name 121.4.62.163 localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 1. 确认改为对应的 Docker 服务名 icube_api
        # 2. 去掉末尾斜杠，保留完整的 /api/ 前缀透传给 Django
        proxy_pass http://icube_api:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/icube_access.log;
    error_log /var/log/nginx/icube_error.log;
}