# 公网网关：统一处理 API、媒体文件、Django 静态文件和前端页面
server {
    listen 80;
    server_name _;

    # 保留 /api/ 前缀并转发给 Compose 中的 api 服务
    location /api/ {
        # proxy_pass 不带尾部斜杠，Django 收到的路径仍以 /api/ 开头
        proxy_pass http://api:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 避免后端短暂不可用时连接无限等待
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 用户上传文件由宿主机 ./media 绑定目录提供
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
    }

    # Django collectstatic 产物通过 collected_static 命名卷共享
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }

    # Docsify 文档站点，通过宿主机 ./docs 绑定目录提供
    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
        # .md 无 MIME 映射，走 default_type 纯文本查看；.pdf 由 mime.types 映射为 application/pdf
        default_type text/plain;
        # 浏览器内联显示而非弹下载框
        add_header Content-Disposition "inline";
    }

    # APK 下载目录，通过宿主机 ./downloads 绑定目录提供
    location /apk/ {
        alias /usr/share/nginx/html/apk/;
        autoindex on;
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # 其余请求交给前端容器；SPA 路由回退由前端 Nginx 处理
    location / {
        proxy_pass http://front:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 日志写入容器标准日志目录，可通过 docker compose logs 查看
    access_log /var/log/nginx/icube_access.log;
    error_log /var/log/nginx/icube_error.log;
}
