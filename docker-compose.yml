# Docker Compose v2+ 使用 Compose Specification，无需声明 version

services:
  db:
    # MySQL 主数据库
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0
    container_name: icube_db
    restart: always
    # 仅在 mysql_data 为空、数据库首次初始化时生效
    environment:
      MYSQL_ROOT_PASSWORD: icube_root123
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: icube_db
      TZ: Asia/Shanghai
      MYSQL_USER: icube_api
      MYSQL_PASSWORD: ${DB_PASSWORD:-icube123}
    volumes:
      # 持久化数据库数据，容器重建后仍保留
      - mysql_data:/var/lib/mysql
      # MySQL 首次初始化时自动执行初始化脚本
      - ./init_data.sql:/docker-entrypoint-initdb.d/02_init_data.sql
    ports:
      # 本地直接连接；服务器远程连接使用 SSH 隧道，不向公网开放 MySQL
      - "127.0.0.1:3306:3306"
    healthcheck:
      # API 必须等待 MySQL 可接受连接，不能只依赖容器启动状态
      test: ["CMD-SHELL", "MYSQL_PWD=icube_root123 mysqladmin ping -h localhost -uroot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      # 首次初始化数据期间不累计健康检查失败次数
      start_period: 45s
    networks:
      - icube_network

  redis:
    # 缓存、JWT 黑名单及 Session 存储
    image: redis:7-alpine
    container_name: icube_redis
    restart: always
    volumes:
      # 持久化 Redis 数据，避免容器重建后缓存数据立即丢失
      - redis_data:/data
    ports:
      # 允许宿主机调试 Redis；仅容器内部访问时可移除
      - "6379:6379"
    networks:
      - icube_network

  api:
    # Django + Gunicorn 后端服务，业务代码在构建时写入镜像
    build:
      context: ./cube_api
      dockerfile: Dockerfile
    container_name: icube_api
    restart: always
    environment:
      # 显式使用生产配置
      - DJANGO_SETTINGS_MODULE=cube_api.settings.prod
      # MySQL 连接参数，db 为 Compose 网络内的服务名
      - DB_NAME=icube_db
      - DB_USER=icube_api
      - DB_PASSWORD=${DB_PASSWORD:-icube123}
      - DB_HOST=db
      - DB_PORT=3306
      # 生产域名、跨域来源和支付宝回调主机由宿主机环境变量传入
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
      - SERVER_HOST=${SERVER_HOST:-localhost}
    volumes:
      # 用户上传文件保存在宿主机，容器重建后仍保留且便于备份
      - ./cube_api/media:/app/media
      # collectstatic 产物通过命名卷交给 Nginx
      - collected_static:/app/collected_static
    depends_on:
      # 等待 MySQL 健康检查通过后再启动
      db:
        condition: service_healthy
      # 仅等待 Redis 容器启动，不检查 Redis 是否已可接受连接
      redis:
        condition: service_started
    networks:
      - icube_network

  front:
    # 多阶段构建 Vue，并由容器内 Nginx 在 80 端口提供 dist
    build:
      context: ./cube_front
      dockerfile: Dockerfile
    container_name: icube_front
    restart: always
    networks:
      - icube_network

  nginx:
    # 公网网关：反向代理 API 和前端，并直接提供媒体及 Django 静态文件
    image: nginx:1.28-alpine
    container_name: icube_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 站点配置和 HTTPS 证书
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      # 与 API 共享媒体文件和 collectstatic 产物
      - ./cube_api/media:/usr/share/nginx/html/media
      - collected_static:/usr/share/nginx/html/static
    depends_on:
      # 仅控制启动顺序；运行状态由各服务的 restart 策略保障
      - api
      - front
    networks:
      - icube_network

volumes:
  # 数据持久化卷
  mysql_data:
  redis_data:
  # API 与 Nginx 共享 Django collectstatic 产物
  collected_static:

networks:
  # 所有服务通过服务名在同一桥接网络内通信
  icube_network:
    driver: bridge
